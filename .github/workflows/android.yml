name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lunora-android-debug-keystore-v1

      - name: Preparar fuentes de la aplicación
        shell: bash
        run: |
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/quicksand/Quicksand%5Bwght%5D.ttf" -o app/src/main/res/font/quicksand_regular.ttf
          curl -fL --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/zenmarugothic/ZenMaruGothic%5Bwght%5D.ttf" -o app/src/main/res/font/zen_maru_gothic_regular.ttf
      - name: Preparar recursos de marca
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          test -s branding/isotipo.png
          test -s branding/imagotipo.png
          cp branding/isotipo.png app/src/main/res/drawable-nodpi/lunora_isotipo.png
          cp branding/imagotipo.png app/src/main/res/drawable-nodpi/lunora_imagotipo.png
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lunora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
